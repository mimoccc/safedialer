androidx-test-rules = "1.5.0"
ezvcard = "0.11.3"
jakarta-mail = "2.0.1"
jakarta-activation = "2.0.1"
paparazzi = "2.0.0-alpha01"
buildkonfig = "0.17.1"

[libraries]
gradle = { module = "com.android.tools.build:gradle", version.ref = "agp" }
